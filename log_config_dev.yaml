version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s - [%(levelname)s] - %(name)s - %(message)s - user_id: %(user_id)s"
    defaults:
      user_id: "-"

handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: default

loggers:
  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: false

  uvicorn.access:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]
